<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4FD1C5; } a:hover { color: #4FD1C5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0D0D; font-family: 'DM Sans', system-ui, sans-serif; color: #EAF2F1; display: flex; flex-direction: column; padding: 60px 24px 24px; box-sizing: border-box; overflow: hidden;">
  <div style="font-family: Lora, Georgia, serif; font-size: 28px; line-height: 1.26; font-weight: 500; letter-spacing: -0.013em; margin-bottom: 28px;">Appearance</div>

  <div style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6968; font-weight: 600; margin-bottom: 12px;">Mode</div>
  <div style="display: flex; gap: 8px; margin-bottom: 30px;">
    <div style="flex-grow: 1; height: 46px; border-radius: 9px; background: #4FD1C5; color: #04100F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Dark</div>
    <div style="flex-grow: 1; height: 46px; border-radius: 9px; border: 1px solid #1F2A29; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #879795;">Light</div>
    <div style="flex-grow: 1; height: 46px; border-radius: 9px; border: 1px solid #1F2A29; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #879795;">System</div>
  </div>

  <div style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6968; font-weight: 600; margin-bottom: 12px;">Palette</div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #132422; border: 1px solid #2A514C; border-radius: 10px; padding: 15px 16px; display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; gap: 5px; flex-shrink: 0;">
        <div style="width: 22px; height: 34px; border-radius: 5px; background: #0A0D0D; border: 1px solid #253331;"></div>
        <div style="width: 22px; height: 34px; border-radius: 5px; background: #4FD1C5;"></div>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; margin-bottom: 2px;">Considered</div>
        <div style="font-size: 12.5px; color: #7FB8B2;">Clear and awake</div>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4FD1C5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 6 9 17l-5-5"/></svg>
    </div>

    <div style="background: #121818; border: 1px solid #1F2A29; border-radius: 10px; padding: 15px 16px; display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; gap: 5px; flex-shrink: 0;">
        <div style="width: 22px; height: 34px; border-radius: 5px; background: #0E1114; border: 1px solid #242C34;"></div>
        <div style="width: 22px; height: 34px; border-radius: 5px; background: #82A9DC;"></div>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; margin-bottom: 2px;">Composed</div>
        <div style="font-size: 12.5px; color: #5A6968;">Cool and quiet</div>
      </div>
    </div>

    <div style="background: #121818; border: 1px solid #1F2A29; border-radius: 10px; padding: 15px 16px; display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; gap: 5px; flex-shrink: 0;">
        <div style="width: 22px; height: 34px; border-radius: 5px; background: #101017; border: 1px solid #282836;"></div>
        <div style="width: 22px; height: 34px; border-radius: 5px; background: #B7A6E9;"></div>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 15px; margin-bottom: 2px;">Still</div>
        <div style="font-size: 12.5px; color: #5A6968;">Soft and low-contrast</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="font-size: 12.5px; line-height: 1.55; color: #5A6968;">More palettes will appear here over time. Nothing else changes when you switch — the words, the spacing and the type stay exactly as they are.</div>
</div>
</x-dc>
</body>
</html>
